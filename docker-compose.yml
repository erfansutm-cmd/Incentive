# Development — run with: docker compose up --build
# (For production use docker-compose.prod.yml instead.)

services:
  backend:
    build:
      context: ./backend
    container_name: incentive-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      DB_USER: ${DB_USER:-erfan.mohamadi}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_HOST: ${DB_HOST:-172.21.41.75}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-}
      DB_CITIES_TABLE: ${DB_CITIES_TABLE:-cities}
      DB_BUSINESS_ENTITIES_TABLE: ${DB_BUSINESS_ENTITIES_TABLE:-business_entities}
      DB_CITY_PLAN_MAPPING_TABLE: ${DB_CITY_PLAN_MAPPING_TABLE:-incentive/incentive_city_plan_mapping}
      DB_INCENTIVE_TYPE_TABLE: ${DB_INCENTIVE_TYPE_TABLE:-mafsho/incentive_type}
      DB_DECISION_MATRIX_TABLE: ${DB_DECISION_MATRIX_TABLE:-incentive/incentive_decision_matrix}
      DB_ACTIVE_CITY_TABLE: ${DB_ACTIVE_CITY_TABLE:-incentive/incentive_active_city}
      DB_CITY_MAPPING_TABLE: ${DB_CITY_MAPPING_TABLE:-mafsho/city_mapping}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: incentive-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
